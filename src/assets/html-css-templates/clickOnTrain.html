<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>clickOnTrain</title>
    <link rel="stylesheet" href="./clickOnTrain.css">
  </head>

  <body>
    <div>
        <div class="rounded-box">
          <div class="inner-box">
            <div class="round-train-route-title";>Green Line B</div>
            <div class="destination-label">To Government Center</div>
          </div>

          <div class="stops">
            <div class="stop past">
              <div class="dot"></div>
              <div class="stop-label">Previous Stop</div>
              <div class="stop-name">BU Central</div>
              <div class="stop-time">11:06 PM</div>
            </div>

            <div class="stop">
              <div class="dot"></div>
              <div class="stop-label">Next Stop</div>
              <div class="stop-name">BU East</div>
              <div class="stop-time">11:09 PM</div>
            </div>

            <div class="stop">
              <div class="dot"></div>
              <div class="stop-label">Upcoming Stop</div>
              <div class="stop-name">Blandford</div>
              <div class="stop-time">11:12 PM</div>
            </div>
          </div>
          
        </div>

    </div>
    
  </body>
</html>
